<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>הצלחת במשימה! | השלב האחרון</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #251c35;
      background: #f4f1f8;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(1.25rem, 5vw, 4rem);
      display: grid;
      place-items: center;
      background-image: radial-gradient(#d6cfde 0.8px, transparent 0.9px);
      background-size: 16px 16px;
    }
    main {
      width: min(100%, 60rem);
      display: grid;
      grid-template-columns: 1.38fr 1fr;
      background: #fffefa;
      border: 2px solid #291e37;
      border-radius: 22px;
      box-shadow: -6px 7px 0 #291e37;
      overflow: hidden;
    }
    .content { align-self: center; padding: clamp(2rem, 4.8vw, 4.1rem); }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 4.3vw, 3.75rem);
      line-height: 1.08;
      letter-spacing: -0.055em;
    }
    .intro {
      max-width: 26ch;
      margin: 1rem 0 0;
      font-size: clamp(1.12rem, 2vw, 1.38rem);
      line-height: 1.55;
      color: #574c62;
    }
    .entry {
      margin-top: 2.15rem;
      padding-top: 1.65rem;
      border-top: 1px solid #d9d2de;
    }
    label { display: block; font-size: 1.06rem; line-height: 1.55; font-weight: 700; }
    input {
      display: block;
      width: 100%;
      min-height: 3.45rem;
      margin: 0.7rem 0 0;
      padding: 0.8rem 1rem;
      border: 2px solid #574662;
      border-radius: 9px;
      background: #fbf9fe;
      color: #291e37;
      font: 1.06rem/1.4 Consolas, monospace;
      text-align: left;
    }
    input::placeholder { color: #776b85; }
    input:focus-visible { outline: 3px solid #7e54b5; outline-offset: 3px; }
    .hint { margin: 0.75rem 0 0; font-size: 0.94rem; line-height: 1.5; color: #665971; }
    .art {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 25rem;
      overflow: hidden;
      isolation: isolate;
      background-color: #35234e;
      background-image: linear-gradient(#ffffff0a 1px, transparent 1px),
                        linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
      background-size: 24px 24px;
      border-inline-start: 2px solid #291e37;
    }
    .medallion {
      position: relative;
      width: min(75%, 17rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid #82689b;
      border-radius: 50%;
      background: radial-gradient(circle at center, #614277 0%, #4d3563 64%, #49315e 100%);
      box-shadow: 0 0 0 9px #35234e, 0 0 0 10px #6d5385;
    }
    .key {
      width: 71%;
      aspect-ratio: 2 / 1;
      position: relative;
      transform: rotate(-42deg);
      filter: drop-shadow(-4px 6px 0 #22172e);
    }
    .key::before, .key::after {
      content: "";
      position: absolute;
      inset: 0;
      clip-path: polygon(0 22%, 9% 22%, 9% 8%, 33% 8%, 33% 22%, 42% 22%,
        42% 41%, 100% 41%, 100% 77%, 92% 77%, 92% 64%, 85% 64%,
        85% 82%, 77% 82%, 77% 64%, 42% 64%, 42% 78%, 33% 78%, 33% 92%,
        9% 92%, 9% 78%, 0 78%, 0 22%, 12% 35%, 12% 65%, 29% 65%, 29% 35%,
        12% 35%, 0 22%);
    }
    .key::before { background: #829842; transform: translate(-3px, 5px); }
    .key::after { background: linear-gradient(180deg, #efffae 8%, #d6fa79 41%, #bfea5a 90%); }
    .star {
      position: absolute;
      width: 1.45rem;
      aspect-ratio: 1;
      background: #ddc6ff;
      clip-path: polygon(43% 0,57% 0,60% 38%,100% 45%,100% 55%,60% 62%,57% 100%,43% 100%,40% 62%,0 55%,0 45%,40% 38%);
    }
    .star-a { left: 16%; top: 19%; }
    .star-b { right: 10%; bottom: 22%; width: 1rem; background: #d6fa79; }
    .star-c { left: 25%; bottom: 14%; width: 0.6rem; }
    @media (max-width: 45rem) {
      main { max-width: 32rem; grid-template-columns: 100%; }
      .content { padding: 2rem 1.5rem; }
      .art { grid-row: 1; min-height: 0; height: clamp(9.5rem, 32vw, 12rem); border-inline-start: 0; border-bottom: 2px solid #291e37; }
      .medallion { width: clamp(6.8rem, 23vw, 8.8rem); }
      .entry { margin-top: 1.5rem; padding-top: 1.25rem; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <section class="content">
      <h1 id="title">הצלחת במשימה!</h1>
      <p class="intro">עברת את כל השלבים של האתגר ונשאר השלב האחרון!</p>
      <div class="entry">
        <label for="challenge-key">תזין את מפתח ה-<bdi>API</bdi> בתיבת הטקסט הבא:</label>
        <input id="challenge-key" type="text" dir="ltr" placeholder="DEMO-…" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="key-hint">
        <p class="hint" id="key-hint">יש להזין מפתח הדגמה בלבד. הערך נשאר בדפדפן.</p>
      </div>
    </section>
    <div class="art" aria-hidden="true">
      <div class="medallion"><span class="key"></span></div>
      <i class="star star-a"></i><i class="star star-b"></i><i class="star star-c"></i>
    </div>
  </main>
</body>
</html>
